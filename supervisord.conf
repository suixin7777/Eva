; ============================================================
; supervisord.conf — Eva Discord bot 进程守护
;
; 设计要点：
;   - nodaemon=true   : 让 supervisord 自己挂在前台，做容器 PID 1
;   - autorestart=true: 任何非正常退出（崩溃、Discord 断连）都拉起来
;   - startretries=10 : 启动 10 次仍失败才放弃（防止快速崩溃死循环）
;   - stopwaitsecs=30 : 给 python 30s 优雅关 Discord 长连接
;   - stopasgroup=true: 子进程一起带走，避免僵尸
;   - 日志双写：stdout 既进 supervisor 自己的轮转文件，也透传给容器
;     （RunPod / docker logs 都能直接看实时输出）
; ============================================================

[supervisord]
nodaemon=true
logfile=%(ENV_EVA_LOG_DIR)s/supervisord.log
logfile_maxbytes=20MB
logfile_backups=5
loglevel=info
pidfile=/tmp/supervisord.pid
user=root
; %(here)s 解析到本文件所在目录，等于 EVA_PROJECT_DIR
childlogdir=%(ENV_EVA_LOG_DIR)s

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ============================================================
; [program:eva-discord]
; 实际跑的 Discord bot 进程
; ============================================================
[program:eva-discord]
command=python -u eva_discord.py
directory=%(here)s
autostart=true
autorestart=true
; 模型加载需要 ~30s，给宽裕的 starting 状态窗口
startsecs=45
startretries=10
; 优雅关闭：先 SIGTERM 让 discord.py 收尾，30s 后再 SIGKILL
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
; ENV 兜底（.env 已经被 eva_config 加载，这里只设容器级运行参数）
environment=
    PYTHONUNBUFFERED="1",
    PYTHONDONTWRITEBYTECODE="1",
    EVA_PROJECT_DIR="%(here)s",
    HF_HOME="%(ENV_HF_HOME)s",
    TRANSFORMERS_CACHE="%(ENV_TRANSFORMERS_CACHE)s",
    SENTENCE_TRANSFORMERS_HOME="%(ENV_SENTENCE_TRANSFORMERS_HOME)s"

; 日志：stdout 各 20MB 轮转 5 份，stderr 同步合并避免错过 traceback
stdout_logfile=%(ENV_EVA_LOG_DIR)s/eva-discord.out.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=%(ENV_EVA_LOG_DIR)s/eva-discord.err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=5
